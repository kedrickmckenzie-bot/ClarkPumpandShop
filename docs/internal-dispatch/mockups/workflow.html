asks panel')">View task</a> <span class="muted"> · </span><a class="inline" href="#" onclick="return demo('Uses the existing Assign a task form')">Assign a task</a><label>Decision</label><div class="actions"><button class="selected-button">Our team</button><button>Outside vendor</button><button>Do on next visit</button><button>Not needed</button></div><label for="urgency">Urgency</label><select id="urgency"><option>Urgent</option><option>Normal</option></select><label>Time estimate <small>Optional</small></label><div class="chips"><button>30 min</button><button>1 h</button><button class="selected-button">2 h</button><button>3 h</button><button>4 h</button><button>All day</button><button>Custom</button></div><label for="notes">Notes for the tech</label><textarea id="notes">Bring a temperature probe. Back door code is at the counter.</textarea><small>Visible on the job and dispatch stops.</small></div><div class="footer"><small>Next: choose a tech and day</small><button class="primary" onclick="location.href='?screen=plan'">Save decision</button></div></section></div></div>`;
const jobs=[['104 North Ridge','Walk-in cooler running warm','2 h'],['114 North Market','Floor drain backing up','2 h'],['101 Northgate','Door seal replacement','1 h']];

const checkout=`<div class="tech"><div class="heading"><div><div class="eyebrow">My work · Alex Morgan</div><h1>Check out</h1></div><span class="tag green">Checked in at 9:10 AM</span></div><section class="surface"><div class="eyebrow">104 North Ridge · CPS-2026-3199</div><h2>Walk-in cooler running warm</h2><p class="muted">Notes for the tech: bring a temperature probe. Back door code is at the counter.</p><label>How did it go?</label><div class="result-grid">${['Fixed','Needs more work','Need parts','Need help','Needs a vendor',"Can't get to it today"].map((x,i)=>`<button class="${i===0?'selected-button':''}" onclick="selectResult(this)">${x}</button>`).join('')}</div><label for="worknotes">Work notes</label><textarea id="worknotes">Cleared the condenser and replaced the fan relay. Temperature is back to 36°F.</textarea><button style="margin-top:10px" onclick="demo('Photo picker preview')">＋ Add photos</button><label>Quick check: working when I left?</label><div class="actions"><button class="selected-button">Yes</button><button>No</button></div><p class="hint">Store staff will be asked to confirm tomorrow at 8 AM. This job stays open until confirmed.</p><div class="footer"><small>Result and notes saved to this job</small><button class="primary" onclick="location.href='?screen=next'">Save checkout</button></div></section></div>`;

if(state==='list')body=review.replace('class="surface review-list"','class="surface"').replace('class="surface review-panel"','class="surface review-panel" style="display:none"');
if(['empty','error','loading','access'].includes(state))body=`<h1>${screen==='review'?'Review':'Dispatch'}</h1><div class="surface state" style="margin-top:24px">${state==='loading'?'<h2>Loading work…</h2><div class="skeleton"></div><div class="skeleton"></div>':state==='empty'?'<h2>All caught up</h2><p>No work needs attention in this view.</p>':state==='access'?'<h2>This work is outside your access</h2><p>Choose a store you can access, or contact your administrator.</p>':'<h2>Your changes weren’t saved</h2><p>The previous plan is still in place. Check your connection and try again.</p><button class="primary" onclick="location.href=location.pathname+\'?screen=plan\'">Try again</button>'}</div>`;
document.getElementById('app').innerHTML=`<div class="preview"><b>Design preview · Fictional data</b>${link('review','Review')}${link('plan','Plan')}${link('today','Today')}${link('checkout','Checkout')}${link('next',"What’s next")}</div><div class="shell"><aside class="nav"><div class="brand">TraceOps</div><div class="suite">Convenience suite</div><a>Overview</a><div class="section">Work</div><a href="?screen=review" class="sub ${screen==='review'?'active':''}">Review <span class="count">5</span></a><a href="?screen=plan" class="sub ${['plan','today'].includes(screen)?'active':''}">Dispatch</a><a class="sub">All work</a><a class="sub">Tasks</a><a>Stores</a><a>Equipment</a><a>Vendors</a><a>Spend & planning</a><div class="section">Organization</div><a>Setup</a></aside><div class="workspace"><header class="top"><span>Clark Pump and Shop <span class="desktop-only"> / All stores</span></span><span><span class="avatar">${['checkout','next'].includes(screen)?'AM':'CD'}</span>${['checkout','next'].includes(screen)?'Alex Morgan':'Chris Delgado'}</span></header><main class="content">${body}<div class="statebar">${['loading','empty','error','access'].map(s=>`<a href="?screen=${screen}&state=${s}">${s==='access'?'No access':s[0].toUpperCase()+s.slice(1)}</a>`).join('')}</div></main></div></div>`;
function demo(message){let old=document.getElementById('toast');if(old)old.remove();let el=document.createElement('div');el.id='toast';el.className='notice';el.style='position:fixed;bottom:16px;left:16px;right:16px;z-index:40;box-shadow:0 6px 25px #23304730';el.textContent='Preview: '+message;el.onclick=()=>el.remove();document.body.append(el);return false}
function selectResult(button){document.querySelectorAll('.result-grid button').forEach(b=>b.classList.remove('selected-button'));button.classList.add('selected-button')}
function chooser(){const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`<section class="modal" role="dialog" aria-label="Give three North jobs"><div class="rowhead"><div><h2>Give 3 North jobs to…</h2><small>Tuesday, October 6 · ~5 h to add</small></div><button onclick="this.closest('.modal-backdrop').remove()" aria-label="Close chooser">×</button></div><p class="hint">Listed alphabetically. Blue tags match these jobs.</p>${people.map((p,i)=>`<div class="option"><input type="radio" name="person" id="p${i}" aria-label="${p}"><label for="p${i}">${p}<small><span class="tag ${i===0||i===3?'blue':''}">${['North','East','South','North','East','South'][i]}</span> <span class="tag ${i===0?'blue':''}">${['Refrigeration · HVAC','Electrical','Fuel systems','HVAC','Plumbing','HVAC'][i]}</span></small><small>${statuses[i][0]}</small></label><small>${[3,4,1,8.5,2,2][i]} h planned</small></div>`).join('')}<div class="footer"><small>Original job deadlines stay the same.</small><button class="primary" onclick="this.closest('.modal-backdrop').remove();demo('3 jobs assigned for Tuesday · Saved · Undo')">Give jobs</button></div></section>`;document.body.append(el)}
</script></body></html>
